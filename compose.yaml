services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pendekin-app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Pendekin
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:dGVzdGtleWZvcnBlbmRla2luZG9ja2VyMTIzNDU2Nzg=
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pendekin_db
      DB_USERNAME: pendekin_user
      DB_PASSWORD: pendekin_password
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pendekin-net

  db:
    image: mysql:8.0
    container_name: pendekin-db
    environment:
      MYSQL_DATABASE: pendekin_db
      MYSQL_USER: pendekin_user
      MYSQL_PASSWORD: pendekin_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - pendekin_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upendekin_user", "-ppendekin_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pendekin-net

  redis:
    image: redis:7-alpine
    container_name: pendekin-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pendekin_redis_data:/data
    networks:
      - pendekin-net

volumes:
  pendekin_db_data:
  pendekin_redis_data:

networks:
  pendekin-net:
    driver: bridge
